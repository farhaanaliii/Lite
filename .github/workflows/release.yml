name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing KEYSTORE_BASE64 secret. Releases must be signed!"
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found in $ANDROID_HOME/build-tools"
            exit 1
          fi

          $APKSIGNER sign \
            --ks release.keystore \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --out app/build/outputs/apk/release/app-release-signed.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

          $APKSIGNER verify --verbose app/build/outputs/apk/release/app-release-signed.apk

      - name: Clean Keystore
        if: always()
        run: rm -f release.keystore

      - name: Prepare APK Asset & Checksum
        run: |
          TAG_NAME="${{ github.ref_name }}"
          DEST_NAME="LitePlusPlus-${TAG_NAME}.apk"

          cp app/build/outputs/apk/release/app-release-signed.apk "$DEST_NAME"
          sha256sum "$DEST_NAME" > "${DEST_NAME}.sha256"
          echo "APK_FILE=$DEST_NAME" >> $GITHUB_ENV
          echo "SHA_FILE=${DEST_NAME}.sha256" >> $GITHUB_ENV

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ env.APK_FILE }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_FILE }}
          path: |
            ${{ env.APK_FILE }}
            ${{ env.SHA_FILE }}
          retention-days: 7

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.APK_FILE }}
            ${{ env.SHA_FILE }}
          generate_release_notes: true
