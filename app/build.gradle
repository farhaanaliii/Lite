plugins {
    id 'com.android.application'
}

android {
    signingConfigs {
        debug {
            // Use the release key for debug builds to preserve app data and sessions when switching
            // between debug and release APKs.
            def localPropertiesFile = rootProject.file('local.properties')
            if (localPropertiesFile.exists()) {
                def localProperties = new Properties()
                localProperties.load(new FileInputStream(localPropertiesFile))
                def keystorePath = localProperties.getProperty('KEYSTORE_PATH')
                if (keystorePath) {
                    if (!file(keystorePath).exists()) {
                        throw new GradleException("KEYSTORE_PATH configured in local.properties was not found: ${keystorePath}")
                    }
                    storeFile file(keystorePath)
                    storePassword localProperties.getProperty('KEYSTORE_PASSWORD')
                    keyAlias localProperties.getProperty('KEY_ALIAS')
                    keyPassword localProperties.getProperty('KEY_PASSWORD')
                }
            }
        }
    }
    namespace = 'com.farhanali.lite'
    compileSdk = 36

    defaultConfig {
        applicationId = "com.farhanali.lite"
        minSdk = 24
        targetSdk = 36
        versionCode = 5
        versionName = "1.2.0"
    }
    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
